<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Kids Game Arcade!</title>
  <script defer src="https://umami-taupe-gamma.vercel.app/script.js" data-website-id="a1be0c78-139e-413a-bb3c-e28b3b9dbe5c"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 3rem;
      color: #fff;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.3rem;
      color: rgba(255,255,255,0.85);
    }

    .stars {
      font-size: 2rem;
      letter-spacing: 8px;
      margin-bottom: 20px;
      animation: twinkle 2s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      max-width: 900px;
      width: 100%;
    }

    .game-card {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 4px solid transparent;
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      border-color: #f093fb;
    }

    .game-card .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 15px;
    }

    .game-card h2 {
      font-size: 1.5rem;
      color: #764ba2;
      margin-bottom: 8px;
    }

    .game-card p {
      font-size: 1rem;
      color: #666;
      line-height: 1.4;
    }

    .game-card .play-badge {
      display: inline-block;
      margin-top: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 8px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .game-card:hover .play-badge {
      background: linear-gradient(135deg, #764ba2, #f093fb);
    }

    .footer {
      margin-top: 60px;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="stars">⭐ 🌟 ✨ 🌟 ⭐</div>
    <h1>🎮 Kids Game Lab!</h1>
    <p>Pick a game and let's play!</p>
  </div>

  <div class="games-grid">

    <a href="./typing/flower-game/" class="game-card">
      <span class="emoji">🌻</span>
      <h2>Flower Typing Garden</h2>
      <p>Type letters to pick beautiful flowers in your garden!</p>
      <span class="play-badge">▶ Play Now</span>
    </a>

  </div>

  <div class="footer">
    <p>Made with ❤️ by kids &amp; parents</p>
  </div>

</body>
</html>
